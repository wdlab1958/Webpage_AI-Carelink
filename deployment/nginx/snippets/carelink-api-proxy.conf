# api.ai-carelink.co.kr 프록시 헤더 — X-Forwarded-For 를 실제 접속 IP 로 덮어쓴다 (위조 방지)
# $carelink_client_ip: Cloudflare 경유면 CF-Connecting-IP, 아니면 접속 IP
#   (정의: AiCarelink 저장소 ops/nginx/https/cloudflare-edge.conf → /etc/nginx/conf.d/carelink-cloudflare.conf)
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $carelink_client_ip;
proxy_set_header X-Forwarded-For   $carelink_client_ip;
proxy_set_header X-Forwarded-Proto $scheme;
