# ═══════════════════════════════════════════════════════════════════════════
# ai-carelink.co.kr — 호스트 Nginx 서버 블록 (가비아 클라우드, 단일 서버) — 4개 호스트 전체의 정본
#
#   www.ai-carelink.co.kr  → 대문(정적 export, 본 저장소)            /home/wdlab/AiCarelink-Webpage/current
#   ai-carelink.co.kr      → www 로 301 정규화
#   app.ai-carelink.co.kr  → 플랫폼 Next.js (5개 도메인 + 모바일 앱 2종)  127.0.0.1:3001
#   api.ai-carelink.co.kr  → FastAPI 백엔드 (/token, /api/*, /ws 혼합 prefix)  127.0.0.1:8100
#   구버전 메인 앱(:3000)은 sites-available/ai-carelink 의 IP default_server 로 남는다 (도메인과 무관).
#   (app/api 는 AiCarelink 저장소 ops/docker-compose.pilot.yml 컨테이너 — 포트는 ops/deploy/env.pilot 과 일치)
#
# HTTPS (2026-09-29 개통) — 서버의 443 은 SSH 와 공유한다 (nginx stream ssl_preread 멀티플렉서).
#   · HTTPS server 블록은 "listen 443 ssl" 을 쓰지 않는다 → include snippets/ai-carelink-ssl.conf
#     (127.0.0.1:8443 ssl http2 proxy_protocol + 인증서 + 실제 클라이언트 IP 복원)
#   · "certbot --nginx" 금지 (listen 443 ssl 을 자동 삽입해 bind 충돌). 인증서는 certbot webroot
#     (/var/www/acme) + certbot.timer 자동 갱신 — AiCarelink 저장소 ops/nginx/https/ 참조.
#   · 필요한 스니펫: acme-challenge.conf · ai-carelink-ssl.conf · mux-https-listen.conf (AiCarelink ops/nginx)
#                    carelink-api-proxy.conf (본 저장소 deployment/nginx/snippets/)
#
# 설치 / 갱신 (서버):
#   sudo install -m 644 deployment/nginx/snippets/carelink-api-proxy.conf /etc/nginx/snippets/
#   sudo install -m 644 deployment/nginx/ai-carelink.co.kr.conf /etc/nginx/sites-available/ai-carelink.co.kr
#   sudo ln -sfn /etc/nginx/sites-available/ai-carelink.co.kr /etc/nginx/sites-enabled/ai-carelink.co.kr
#   sudo nginx -t && sudo systemctl reload nginx
#
# DNS(가비아): A 레코드 @ / www / app / api → 103.55.190.5
# ═══════════════════════════════════════════════════════════════════════════

# api 프록시 헤더 — /etc/nginx/snippets/carelink-api-proxy.conf (같은 디렉터리의 snippets/ 에서 복사)
#   X-Forwarded-For 를 $carelink_client_ip(Cloudflare 경유 시 CF-Connecting-IP, 아니면 접속 IP)로 "덮어쓴다". proxy_params 의 $proxy_add_x_forwarded_for 는 클라이언트가
#   보낸 값 뒤에 덧붙이는데, 백엔드(uvicorn FORWARDED_ALLOW_IPS=*)는 맨 앞 값을 클라이언트 IP 로 쓰므로
#   위조 헤더로 로그인 레이트리밋을 우회할 수 있다.
upstream aicarelink_app { server 127.0.0.1:3001; keepalive 16; }
upstream aicarelink_api { server 127.0.0.1:8100; keepalive 32; }

# 로그인 무차별 대입 2차 방어 (1차: 백엔드 레이트리밋 5회/60초 · 계정 잠금)
# 키는 실제 사용자 IP — Cloudflare 경유 시 $remote_addr 는 Cloudflare 엣지라 여러 사용자가 한 칸을 나눠 쓰게 된다
#   (존 이름에 _cip — 키를 바꾼 존은 같은 이름으로 reload 할 수 없어 새 이름으로 만든다)
limit_req_zone $carelink_client_ip zone=carelink_auth_cip:10m rate=10r/m;
limit_req_zone $carelink_client_ip zone=carelink_api_cip:10m rate=300r/m;

map $http_upgrade $carelink_connection_upgrade {
    default upgrade;
    ""      close;
}

# ── :80 — 도메인 접속은 HTTPS 로 (ACME 챌린지만 예외) ─────────────────────
server {
    listen 80;
    server_name ai-carelink.co.kr www.ai-carelink.co.kr app.ai-carelink.co.kr api.ai-carelink.co.kr;
    include snippets/acme-challenge.conf;
    location / { return 301 https://$host$request_uri; }
}

# ── 루트 → www 정규화 ─────────────────────────────────────────────────────
server {
    include snippets/ai-carelink-ssl.conf;
    server_name ai-carelink.co.kr;
    return 301 https://www.ai-carelink.co.kr$request_uri;
}

# ── www: 대문 (정적) ──────────────────────────────────────────────────────
server {
    include snippets/ai-carelink-ssl.conf;
    server_name www.ai-carelink.co.kr;

    root /home/wdlab/AiCarelink-Webpage/current;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # 대문은 Next 정적 export — 인라인 스크립트/스타일을 쓰므로 unsafe-inline 유지, 외부는 폰트만 (WBS 2.8 보완, 2026-10-01)
    add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; font-src 'self' data: https://fonts.gstatic.com https://cdn.jsdelivr.net; img-src 'self' data: https:; connect-src 'self' https://api.ai-carelink.co.kr; object-src 'none'" always;

    # Next.js 정적 export (trailingSlash: true) — /pilot-2026/ → /pilot-2026/index.html
    error_page 404 /404.html;

    location / {
        try_files $uri $uri/ $uri.html =404;
    }
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location /images/ {
        expires 30d;
    }
}

# ── app: 플랫폼 (Next.js) — 웹 5개 도메인 + 환자·보호자/간병인 모바일 PWA ──
server {
    include snippets/ai-carelink-ssl.conf;
    server_name app.ai-carelink.co.kr;

    client_max_body_size 20m;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 서비스워커는 항상 재검증 (PWA 업데이트 즉시 반영)
    # next/image 미사용 — 이미지 최적화 API 는 Next 14.x 에 수정되지 않은 RCE/DoS 권고가 있어 nginx 에서 차단 (WBS 2.7, 2026-10-01)
    location = /_next/image {
        return 404;
    }
    location = /sw.js {
        proxy_pass http://aicarelink_app;
        include /etc/nginx/proxy_params;
        add_header Cache-Control "no-cache" always;
    }
    location /_next/static/ {
        proxy_pass http://aicarelink_app;
        include /etc/nginx/proxy_params;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
    location / {
        proxy_pass http://aicarelink_app;
        proxy_http_version 1.1;
        include /etc/nginx/proxy_params;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $carelink_connection_upgrade;
    }
}

# ── api: 백엔드 (FastAPI) ─────────────────────────────────────────────────
server {
    include snippets/ai-carelink-ssl.conf;
    server_name api.ai-carelink.co.kr;

    client_max_body_size 20m;       # 간병인 검증서류 업로드

    # API 문서·메트릭은 외부 비공개 (서버에서 curl 127.0.0.1:8100/docs 로 확인)
    location ~ ^/(docs|redoc|openapi\.json|metrics)$ {
        return 404;
    }

    # 로그인·토큰 — 무차별 대입 완화
    location ~ ^/(token|api/auth/login|api/auth/refresh)$ {
        limit_req zone=carelink_auth_cip burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://aicarelink_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        include /etc/nginx/snippets/carelink-api-proxy.conf;
    }

    # WebSocket / SSE
    location ~ ^/(ws|api/ws|api/notifications/stream) {
        proxy_pass http://aicarelink_api;
        proxy_http_version 1.1;
        include /etc/nginx/snippets/carelink-api-proxy.conf;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $carelink_connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }

    location / {
        limit_req zone=carelink_api_cip burst=100 nodelay;
        limit_req_status 429;
        proxy_pass http://aicarelink_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        include /etc/nginx/snippets/carelink-api-proxy.conf;
        proxy_read_timeout 300s;
    }
}
