# ═══════════════════════════════════════════════════════════════════════════
# ai-carelink.co.kr — Nginx 서버 블록 (가비아 클라우드, 단일 서버)
#
#   www.ai-carelink.co.kr  → 대문(정적 export, 본 저장소)  /opt/aicarelink-webpage/current
#   ai-carelink.co.kr      → www 로 301 정규화
#   app.ai-carelink.co.kr  → 플랫폼 Next.js (5개 도메인 + 모바일 앱 2종)   127.0.0.1:3001
#   api.ai-carelink.co.kr  → FastAPI 백엔드 (/token, /api/*, /ws 등 혼합 prefix라 서브도메인 분리)  127.0.0.1:8001
#
# 설치:
#   sudo cp deployment/nginx/ai-carelink.co.kr.conf /etc/nginx/conf.d/
#   (AiCarelink compose 스택의 nginx 컨테이너를 쓰는 경우 → ops/nginx/ 에 복사, 업스트림 포트를
#    compose 포트(frontend 3000 / backend 5005)로 맞출 것)
#   sudo certbot --nginx -d ai-carelink.co.kr -d www.ai-carelink.co.kr -d app.ai-carelink.co.kr -d api.ai-carelink.co.kr
#   sudo nginx -t && sudo systemctl reload nginx
#
# DNS(가비아): A 레코드 @ / www / app / api → 서버 공인 IP
# ═══════════════════════════════════════════════════════════════════════════

# 플랫폼 업스트림 포트 — 서버 실제 기동 포트에 맞게 조정
upstream aicarelink_app { server 127.0.0.1:3001; }
upstream aicarelink_api { server 127.0.0.1:8001; }

# ── 루트 → www 정규화 ─────────────────────────────────────────────────────
server {
    listen 80;
    listen 443 ssl http2;
    server_name ai-carelink.co.kr;
    # ssl_certificate     /etc/letsencrypt/live/ai-carelink.co.kr/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/ai-carelink.co.kr/privkey.pem;
    return 301 https://www.ai-carelink.co.kr$request_uri;
}

# ── www: 대문 (정적) ──────────────────────────────────────────────────────
server {
    listen 80;
    server_name www.ai-carelink.co.kr;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl http2;
    server_name www.ai-carelink.co.kr;
    # ssl_certificate     /etc/letsencrypt/live/ai-carelink.co.kr/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/ai-carelink.co.kr/privkey.pem;

    root /opt/aicarelink-webpage/current;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Next.js 정적 export (trailingSlash: true) — /pilot-2026/ → /pilot-2026/index.html
    location / {
        try_files $uri $uri/ $uri.html /404.html;
    }
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location /images/ {
        expires 30d;
    }
}

# ── app: 플랫폼 (Next.js) ─────────────────────────────────────────────────
server {
    listen 80;
    server_name app.ai-carelink.co.kr api.ai-carelink.co.kr;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl http2;
    server_name app.ai-carelink.co.kr;
    # ssl_certificate     /etc/letsencrypt/live/ai-carelink.co.kr/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/ai-carelink.co.kr/privkey.pem;

    client_max_body_size 20m;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        proxy_pass http://aicarelink_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# ── api: 백엔드 (FastAPI) ─────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name api.ai-carelink.co.kr;
    # ssl_certificate     /etc/letsencrypt/live/ai-carelink.co.kr/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/ai-carelink.co.kr/privkey.pem;

    client_max_body_size 20m;

    location / {
        proxy_pass http://aicarelink_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # WebSocket (/ws/*)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }
}
