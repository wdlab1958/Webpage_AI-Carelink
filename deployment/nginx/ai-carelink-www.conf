# ═══════════════════════════════════════════════════════════════════════════
# ai-carelink.co.kr 대문 (정적 export) — 도메인 기준 서빙, HTTP 전용 (현재 서버 적용본)
#
#   www.ai-carelink.co.kr → /home/wdlab/AiCarelink-Webpage/current
#   ai-carelink.co.kr     → www 로 301
#   그 외(서버 IP 직접 접속 등) → sites-available/ai-carelink (메인 앱 :3000, default_server)
#
# 설치:
#   sudo install -m 644 deployment/nginx/ai-carelink-www.conf /etc/nginx/sites-available/ai-carelink-www
#   sudo ln -sfn /etc/nginx/sites-available/ai-carelink-www /etc/nginx/sites-enabled/ai-carelink-www
#   chmod o+x /home/wdlab        # nginx(www-data) 가 홈 아래 current 를 읽을 수 있도록
#   sudo nginx -t && sudo systemctl reload nginx
#
# HTTPS 는 DNS 등록 후 certbot 으로 추가:
#   sudo certbot --nginx -d ai-carelink.co.kr -d www.ai-carelink.co.kr
# 배포: DEPLOY_ROOT=$HOME/AiCarelink-Webpage bash ~/AiCarelink-Webpage/repo/deployment/deploy-webpage.sh
# ═══════════════════════════════════════════════════════════════════════════

server {
    listen 80;
    server_name ai-carelink.co.kr;
    return 301 $scheme://www.ai-carelink.co.kr$request_uri;
}

server {
    listen 80;
    server_name www.ai-carelink.co.kr;

    root /home/wdlab/AiCarelink-Webpage/current;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    error_page 404 /404.html;

    # Next.js 정적 export (trailingSlash: true) — /pilot-2026/ → /pilot-2026/index.html
    location / {
        try_files $uri $uri/ $uri.html =404;
    }
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location /images/ {
        expires 30d;
    }
}
